        expect:
          tools_any: [find_movers]
          tool_args:
            - tool: find_movers
              where: {filter.set: {contains: evolving}, direction: down, window: 30d}
          tiles_from_tools: [find_movers]
          tiles_min: 1
          tiles_max: 3
          named_cards_in_tiles: true
          tiles_none_match: [{japanese: true}, {sealed: true}]
          # "recently"/"lately": the owner's wording when the history doesn't cover the window.
          must_contain_any: ["month", "30 days", "30-day", "recently", "lately"]
        rubric:
          - "Does the answer name the Evolving Skies card with the largest drop in the tool results, with its real numbers?"
          - "Does it name the window (this month / 30 days) only for cards whose history covers it (else neutral wording like 'recently'), without saying how much history exists?"
          # Owner 2026-11-20: list answers are one bullet per card, name + price + % in bold.
          - "Is each named card on its own '- ' bullet with its name, price and % change in **bold**?"

