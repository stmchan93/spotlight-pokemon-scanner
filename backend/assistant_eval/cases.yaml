    holdout: true
    turns:
      - ask: "Show me Riftbound cards with Jinx"
        expect:
          tool_args:
            - tool: search_cards
              where: {filter.game: riftbound}
          tiles_none_match: [{game_not: riftbound}]
        rubric:
          - "Does the answer show Riftbound Jinx cards, or say plainly none were found?"

  # --- longer explanations ------------------------------------------------------
  # L016 is a pair: with history it must describe the real move (and can't pass on a
  # "couldn't verify" reply); with the history removed it must fall back honestly.
  - id: why_charizard_moved
    review_label: L016
    category: explanation
    turns:
      - ask: "Why did Charizard ex 151 #199 go up recently?"
        expect:
          tools_all: [get_price_history]
          chart_required: true
          chart_card_matches_tile: true
          tiles_exact: [sv3pt5-199]
          must_not_contain: ["(couldn'?t|could not|can'?t|cannot|unable to) verify", 'no (recent )?price history']
          max_words: 95
        reference: "Lead with the actual move and its dates from the price history; if the chart doesn't show a rise, say what it shows; give a cause only with evidence."
        rubric:
          - "Does the first sentence give the real price move with dates from the tool results (or say plainly the history shows no rise)?"
          - "Does it avoid stating unverifiable causes as fact?"

  - id: why_charizard_moved_no_history
    review_label: L016 (fallback)
    category: explanation
    fixtures:
      delete:
        - {table: card_price_history_daily, where: {card_id: sv3pt5-199}}
        - {table: card_price_history_cell, where: {card_id: sv3pt5-199}}
    turns:
      - ask: "Why did Charizard ex 151 #199 go up recently?"
        expect:
          tools_any: [get_price_history, get_card]
          no_chart: true
          tiles_exact: [sv3pt5-199]
          must_contain_any: ["couldn't verify", "could not verify", "can't verify", "cannot verify", "unable to verify", "no price history", "don't have price history", "no recent price history"]
          max_words: 60
        reference: "I couldn't verify a recent price increase for Charizard ex (151, #199/165). Its current market price is $287.93."
        rubric:
          - "Does the answer say it couldn't verify a recent increase, rather than claiming or explaining one?"
          - "Does it give the card's current USD price consistent with the tool results (or say there is none)?"

  - id: explain_pricing
    category: explanation
    turns:
      - ask: "Explain how Ekalight prices my cards"
        expect:
          max_words: 95
        rubric:
          - "Does the answer say prices are USD market prices from daily data, not live?"
          - "Does it explain what a market price means in plain English?"
