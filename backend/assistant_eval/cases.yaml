  # --- graded --------------------------------------------------------------------
  - id: top_psa10
    review_label: L010
    category: graded
    turns:
      - ask: "What are the most expensive PSA 10s?"
        expect:
          tools_all: [find_top_graded]
          tool_args:
            - tool: find_top_graded
              where: {grader: PSA, grade: "10"}
          # Owner (L010): two PSA 10 tiles, the top trusted result first. Run 1's #2 (Gengar
          # base6-11, $408,000) is now excluded as untrusted, so ids aren't pinned.
          tiles_from_tools: [find_top_graded]
          tiles_include_top: find_top_graded
          tiles_within: [{grader: PSA, grade: "10"}]
          tiles_min: 2
          tiles_max: 2
          tiles_all_named: true
          named_cards_in_tiles: true
          tiles_none_match: [{price_gte: 999999}]
          tiles_price_trusted: true
        reference: "The top PSA 10 is the 1st Edition Shadowless Base Set Charizard at about $409,540, followed by [the next trusted PSA 10 in the results] at about $[price]. (Say \"verified\" only for recorded sales.)"
        rubric:
          - "Does the answer name the top PSA 10 with its graded USD price, consistent with the tool results?"
          - "Does it avoid citing an obvious placeholder price (e.g. $999,999) or a price the tool marks as untrusted?"
          - "If it says \"verified\", do the tool results mark those prices price_verified (a recorded sale)?"

  - id: worth_grading
    review_label: L026
    category: graded
    fixtures:
      # PSA 10 comp inputs (synthetic eBay sales). Lugia is left without a comp on purpose.
      delete:
        - {table: slab_recent_sales, where: {card_id: bw5-104, grader: PSA, grade: "10"}}
        - {table: slab_recent_sales_cache, where: {card_id: bw5-104, grader: PSA, grade: "10"}}
        - {table: slab_recent_sales, where: {card_id: xy5g_ja-77, grader: PSA, grade: "10"}}
        - {table: slab_recent_sales_cache, where: {card_id: xy5g_ja-77, grader: PSA, grade: "10"}}
      insert:
        - table: slab_recent_sales_cache
          rows:
            - {card_id: bw5-104, grader: PSA, grade: "10", source: ebay, status: available, result_count: 2, fetched_at: $NOW, created_at: $NOW, updated_at: $NOW}
            - {card_id: xy5g_ja-77, grader: PSA, grade: "10", source: ebay, status: available, result_count: 1, fetched_at: $NOW, created_at: $NOW, updated_at: $NOW}
        - table: slab_recent_sales
          rows:
            - {id: eval-fixture-kyogre-1, card_id: bw5-104, grader: PSA, grade: "10", source: ebay, source_sale_id: eval-fixture-kyogre-1, rank: 1, title: "EVAL FIXTURE Kyogre-EX Dark Explorers 104/108 PSA 10", sold_at: $TODAY, price: 1450.0, currency_code: USD, created_at: $NOW}
            - {id: eval-fixture-kyogre-2, card_id: bw5-104, grader: PSA, grade: "10", source: ebay, source_sale_id: eval-fixture-kyogre-2, rank: 2, title: "EVAL FIXTURE Kyogre-EX Dark Explorers 104/108 PSA 10", sold_at: $TODAY, price: 1500.0, currency_code: USD, created_at: $NOW}
            - {id: eval-fixture-teammates-1, card_id: xy5g_ja-77, grader: PSA, grade: "10", source: ebay, source_sale_id: eval-fixture-teammates-1, rank: 1, title: "EVAL FIXTURE Teammates 077/070 PSA 10", sold_at: $TODAY, price: 45.0, currency_code: USD, created_at: $NOW}
    turns:
      - ask: "Is anything I own worth grading?"
        expect:
          tools_all: [grading_upside]
          tool_result_where:
            # The seeded sales are what grading_upside reads (slab_recent_sales, source ebay).
            - tool: grading_upside
              where: {cards.card_id: bw5-104, cards.comp_source: ebay_sold}
          tiles_min: 3
          tiles_max: 3
          tiles_include: [{name_regex: '^Kyogre-EX$'}]
          named_cards_in_tiles: true
          # Owner 2026-11-20: no table; one bullet per card.
          must_not_contain: ['\|']
          must_contain_any: ["- **"]
          max_words: 160
        reference: "Your strongest grading candidates are Kyogre-EX, Lugia and Teammates.\n- **Kyogre-EX** (Dark Explorers 104/108): raw $504.48 → PSA 10 $1,450 (+$945.52, +187%)\n- **Teammates** (Gaia Volcano 077/070): raw $[raw] → PSA 10 $45 (+$[diff], +[pct]%)\n- **Lugia** ([set number]): raw $[raw] · no recent PSA 10 sale\nGrading costs money and takes time, so fees eat into the smaller gaps."
        rubric:
          - "Does the answer name specific cards the user owns as grading candidates?"
          - "For each card with a PSA 10 comp in the tool results, does it compare the raw price with that comp using real numbers?"
          - "Is every gross premium it states equal to PSA 10 price minus raw price (and % = that difference / raw price)?"
          - "If a card has no PSA 10 comp in the tool results, does the answer say so for that card (or not invent one)?"

  - id: my_top_slab
    category: graded
    holdout: true
    turns:
