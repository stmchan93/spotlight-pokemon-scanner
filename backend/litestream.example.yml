# Optional continuous SQLite replication. Copy to litestream.yml, fill in, and
# enable the `litestream` sidecar in docker-compose.yml. Pin the image to 0.3.14
# so the WAL/restore format matches prod (see tools/restore_staging_db_local.sh).
dbs:
  - path: /app/backend/data/spotlight_scanner.sqlite
    replicas:
      # --- Option A: Google Cloud Storage (keep GCP) ---
      #   needs GOOGLE_APPLICATION_CREDENTIALS mounted to the sidecar.
      - type: gcs
        bucket: looty-prod-backups        # <-- your prod backup bucket
        path: spotlight_scanner

      # --- Option B: DigitalOcean Spaces / any S3 (fully off GCP) ---
      # - type: s3
      #   bucket: spotlight-backups
      #   path: spotlight_scanner
      #   endpoint: https://nyc3.digitaloceanspaces.com
      #   region: nyc3
      #   access-key-id: ${SPACES_KEY}
      #   secret-access-key: ${SPACES_SECRET}

# Restore on a fresh box (before first boot), e.g.:
#   litestream restore -o /app/backend/data/spotlight_scanner.sqlite \
#     gcs://looty-prod-backups/spotlight_scanner
