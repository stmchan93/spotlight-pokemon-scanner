<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotlight Moderation Queue</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151923;
      --panel-2: #1d2330;
      --border: #2a3140;
      --text: #e8ecf3;
      --muted: #8b94a6;
      --accent: #4f8cff;
      --accent-2: #2bd47d;
      --warn: #ffb020;
      --danger: #ff5d6c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .err { color: var(--danger); }
    .hidden { display: none !important; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
    input, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      background: var(--panel);
      color: var(--text);
      margin: 6px 0;
    }
    textarea { min-height: 54px; resize: vertical; }
    button {
      cursor: pointer;
      padding: 10px 14px;
      background: var(--panel-2);
      color: var(--text);
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    button:hover { background: #232a3a; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.ok { background: var(--accent-2); border-color: var(--accent-2); color: #06241a; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #2a0a0e; }
    button:disabled { opacity: 0.5; cursor: default; }
    .mode-bar { display: flex; gap: 8px; margin: 10px 0; }
    .mode-bar button { flex: 1; }
    .mode-bar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .card-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .chip {
      display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 2px 7px; border-radius: 999px;
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
    }
    .chip.post { background: #16304f; color: #8fc0ff; }
    .chip.comment { background: #1c3c2c; color: #7fdcae; }
    .chip.pile { background: #4a3a15; color: var(--warn); }
    .chip.removed { background: #4a1a20; color: var(--danger); }
    .chip.pending { background: #4a3a15; color: var(--warn); }
    .chip.visible { background: #1c3c2c; color: var(--accent-2); }
    .chip.rejected { background: #4a1a20; color: var(--danger); }
    .chip.approved { background: #1c3c2c; color: var(--accent-2); }
    .body {
      white-space: pre-wrap; word-break: break-word;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; margin: 10px 0;
    }
    .body.empty { color: var(--muted); font-style: italic; }
    .reason { color: var(--warn); margin-top: 6px; font-size: 14px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .media { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
    .media figure { margin: 0; width: 140px; }
    .media img {
      width: 140px; height: 140px; object-fit: cover;
      background: #000; border-radius: 10px; border: 1px solid var(--border);
      display: block;
    }
    .media figcaption { font-size: 11px; margin-top: 4px; text-align: center; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .actions button { flex: 1; min-width: 110px; }
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 12px; max-width: 90vw;
    }
    .toast.err { border-color: var(--danger); color: var(--danger); }
    code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Spotlight Moderation Queue</h1>
    <div class="sub">Reports filed by people in the app. Nothing here is auto-resolved &mdash; the AI pass holds reported content until you decide.</div>

    <!-- Login (same email OTP flow as /review) -->
    <div id="login" class="card-panel hidden">
      <div class="muted">Sign in with your email to moderate reports.</div>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <button id="sendCode" class="primary" style="width:100%">Send me a login code</button>
      <div id="codeBox" class="hidden">
        <input id="code" type="text" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code" />
        <button id="verifyCode" class="ok" style="width:100%">Verify code</button>
        <div class="hint">Or just click the magic link in the email; this tab will pick it up.</div>
      </div>
      <div id="loginMsg" class="hint"></div>
    </div>

    <!-- Boot / status -->
    <div id="boot" class="muted">Loading&hellip;</div>

    <!-- Status filter -->
    <div id="modeBar" class="mode-bar hidden">
      <button id="modeOpen" class="active">Open</button>
      <button id="modeActioned">Actioned</button>
      <button id="modeDismissed">Dismissed</button>
    </div>

    <div id="queueMeta" class="muted hidden" style="margin:4px 0 0;"></div>
    <div id="queue"></div>

    <div id="signedOutBar" class="hidden" style="margin-top:16px;">
      <button id="refresh">Refresh</button>
      <button id="signOut">Sign out</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    let sbClient = null;
    let accessToken = null;
    let status = "open";
    const objectUrls = [];

    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function showToast(msg, isErr) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.toggle("err", !!isErr);
      t.classList.remove("hidden");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add("hidden"), 2800);
    }

    function authHeaders() {
      return accessToken ? { Authorization: "Bearer " + accessToken } : {};
    }

    function who(identity) {
      if (!identity) return "unknown";
      if (identity.handle) return "@" + identity.handle;
      if (identity.display_name) return identity.display_name;
      return identity.user_id || "unknown";
    }

    function when(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
    }

    // --- auth ---------------------------------------------------------------

    async function boot() {
      let cfg;
      try {
        const res = await fetch("/api/v1/review/config");
        cfg = await res.json();
      } catch (e) {
        $("boot").innerHTML = '<span class="err">Could not load config.</span>';
        return;
      }
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        $("boot").innerHTML = '<span class="err">Supabase is not configured on the backend.</span>';
        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        $("boot").innerHTML = '<span class="err">Auth library failed to load. Refresh the page.</span>';
        return;
      }
      sbClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
      });

      const { data } = await sbClient.auth.getSession();
      if (data && data.session) {
        onSignedIn(data.session);
      } else {
        $("boot").classList.add("hidden");
        $("login").classList.remove("hidden");
      }

      sbClient.auth.onAuthStateChange((_event, session) => {
        if (session) onSignedIn(session);
      });
    }

    function onSignedIn(session) {
      accessToken = session.access_token;
      $("login").classList.add("hidden");
      $("signedOutBar").classList.remove("hidden");
      $("modeBar").classList.remove("hidden");
      loadQueue();
    }

    // --- queue --------------------------------------------------------------

    function releaseObjectUrls() {
      while (objectUrls.length) URL.revokeObjectURL(objectUrls.pop());
    }

    async function loadQueue() {
      releaseObjectUrls();
      $("queue").innerHTML = "";
      $("queueMeta").classList.add("hidden");
      $("boot").classList.remove("hidden");
      $("boot").textContent = "Loading reports…";

      let res;
      try {
        res = await fetch(
          "/api/v1/moderation/queue?status=" + encodeURIComponent(status) + "&limit=50",
          { headers: authHeaders() }
        );
      } catch (e) {
        $("boot").innerHTML = '<span class="err">Failed to load the queue.</span>';
        return;
      }
      if (res.status === 403) {
        const body = await res.json().catch(() => ({}));
        $("boot").innerHTML =
          '<div class="err">Reviewer access required.</div>' +
          '<div class="hint">' + escapeHtml(body.message || "") + "</div>" +
          '<div class="hint">Your user id: <code>' + escapeHtml(body.userId || "?") +
          "</code><br/>Your email: <code>" + escapeHtml(body.email || "?") + "</code></div>";
        return;
      }
      const payload = await res.json().catch(() => null);
      if (!res.ok || !payload) {
        $("boot").innerHTML =
          '<span class="err">' + escapeHtml((payload && payload.error) || "Failed to load the queue.") + "</span>";
        return;
      }

      const items = payload.items || [];
      $("boot").classList.add("hidden");
      $("queueMeta").classList.remove("hidden");
      $("queueMeta").textContent =
        items.length + " " + status + " report" + (items.length === 1 ? "" : "s");

      if (!items.length) {
        $("queue").innerHTML =
          '<div class="card-panel"><div style="font-size:16px;font-weight:600;">Nothing ' +
          escapeHtml(status) + " 🎉</div><div class=\"muted\" style=\"margin-top:6px;\">" +
          (status === "open"
            ? "No reports are waiting on a human right now."
            : "No reports in this bucket.") +
          "</div></div>";
        return;
      }
      items.forEach((item) => $("queue").appendChild(renderReport(item)));
    }

    function statusChip(value) {
      const known = ["visible", "pending", "removed", "approved", "rejected"];
      const cls = known.indexOf(value) >= 0 ? " " + value : "";
      return '<span class="chip' + cls + '">' + escapeHtml(value || "unknown") + "</span>";
    }

    function renderReport(item) {
      const el = document.createElement("div");
      el.className = "card-panel";
      const target = item.target;
      const kind = item.target_type || "unknown";
      const pile = item.open_report_count > 1
        ? '<span class="chip pile">' + item.open_report_count + " reporters</span>"
        : "";

      let head =
        '<div class="row">' +
        '<span class="chip ' + escapeHtml(kind) + '">' + escapeHtml(kind) + "</span>" +
        (target ? statusChip(target.content_status) : '<span class="chip">no content</span>') +
        pile +
        '<span class="spacer"></span>' +
        '<span class="muted" style="font-size:12px;">' + escapeHtml(when(item.created_at)) + "</span>" +
        "</div>";

      let bodyBlock;
      if (!target) {
        bodyBlock =
          '<div class="body empty">The reported ' + escapeHtml(kind) +
          " is gone from the database (hard-deleted, or this target type has no stored body). " +
          "Dismiss the report to clear it.</div>";
      } else {
        const text = (target.body || "").trim();
        bodyBlock = text
          ? '<div class="body">' + escapeHtml(text) + "</div>"
          : '<div class="body empty">(no text — image-only)</div>';
      }

      const meta =
        '<div class="reason">Reason: ' +
        escapeHtml(item.reason ? item.reason : "(none given)") + "</div>" +
        '<div class="meta">Reported by ' + escapeHtml(who(item.reporter)) +
        (target ? " · author " + escapeHtml(who(target.author)) : "") +
        (target && target.created_at ? " · posted " + escapeHtml(when(target.created_at)) : "") +
        "</div>" +
        '<div class="meta">report <code>' + escapeHtml(item.report_id || "") +
        "</code> · target <code>" + escapeHtml(item.target_id || "") + "</code></div>";

      el.innerHTML = head + bodyBlock + meta + '<div class="media"></div><div class="actions"></div>';

      // Media (authenticated fetch -> blob, same as /review images)
      const mediaEl = el.querySelector(".media");
      const media = (target && target.media) || [];
      media.forEach((m) => {
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        const cap = document.createElement("figcaption");
        cap.innerHTML = statusChip(m.moderation_status);
        fig.appendChild(img);
        fig.appendChild(cap);
        mediaEl.appendChild(fig);
        fetch(m.url, { headers: authHeaders() })
          .then((r) => (r.ok ? r.blob() : null))
          .then((b) => {
            if (!b) { cap.innerHTML = '<span class="chip">unavailable</span>'; return; }
            const url = URL.createObjectURL(b);
            objectUrls.push(url);
            img.src = url;
          })
          .catch(() => { cap.innerHTML = '<span class="chip">unavailable</span>'; });
      });

      // Actions
      const actionsEl = el.querySelector(".actions");
      const canActOnContent = !!target && (kind === "post" || kind === "comment");
      const verbs = [
        { verb: "remove", label: "Remove content", cls: "danger", enabled: canActOnContent },
        { verb: "keep", label: "Keep (republish)", cls: "ok", enabled: canActOnContent },
        { verb: "dismiss", label: "Dismiss report", cls: "", enabled: true },
      ];
      if (item.status !== "open") {
        const done = document.createElement("div");
        done.className = "muted";
        done.textContent =
          "Resolved " + when(item.reviewed_at) + (item.reviewed_by ? " by " + item.reviewed_by : "");
        actionsEl.appendChild(done);
        return el;
      }
      verbs.forEach((v) => {
        const b = document.createElement("button");
        b.className = v.cls;
        b.textContent = v.label;
        b.disabled = !v.enabled;
        b.onclick = () => submitAction(el, item, v.verb);
        actionsEl.appendChild(b);
      });
      return el;
    }

    async function submitAction(el, item, verb) {
      el.querySelectorAll("button").forEach((b) => (b.disabled = true));
      let res, payload;
      try {
        res = await fetch("/api/v1/moderation/action", {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
          body: JSON.stringify({
            action: verb,
            targetType: item.target_type,
            targetId: item.target_id,
            reportId: verb === "dismiss" ? item.report_id : undefined,
          }),
        });
        payload = await res.json().catch(() => null);
      } catch (e) {
        showToast("Action failed — network error", true);
        el.querySelectorAll("button").forEach((b) => (b.disabled = false));
        return;
      }
      if (!res.ok) {
        showToast((payload && payload.error) || "Action failed", true);
        el.querySelectorAll("button").forEach((b) => (b.disabled = false));
        return;
      }
      showToast(
        verb + " — " + (payload.reports_resolved || 0) + " report(s) resolved" +
        (payload.content_status ? ", content now " + payload.content_status : "")
      );
      el.remove();
      const remaining = $("queue").querySelectorAll(".card-panel").length;
      $("queueMeta").textContent =
        remaining + " " + status + " report" + (remaining === 1 ? "" : "s");
      if (!remaining) loadQueue();
    }

    function setStatus(next) {
      if (next === status) return;
      status = next;
      $("modeOpen").classList.toggle("active", status === "open");
      $("modeActioned").classList.toggle("active", status === "actioned");
      $("modeDismissed").classList.toggle("active", status === "dismissed");
      loadQueue();
    }

    // --- wiring -------------------------------------------------------------

    $("sendCode").onclick = async () => {
      const email = $("email").value.trim();
      if (!email) { $("loginMsg").textContent = "Enter your email first."; return; }
      $("sendCode").disabled = true;
      const { error } = await sbClient.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href.split("#")[0] },
      });
      $("sendCode").disabled = false;
      if (error) {
        $("loginMsg").innerHTML = '<span class="err">' + escapeHtml(error.message) + "</span>";
        return;
      }
      $("codeBox").classList.remove("hidden");
      $("loginMsg").textContent = "Check your email for a 6-digit code or magic link.";
    };

    $("verifyCode").onclick = async () => {
      const email = $("email").value.trim();
      const token = $("code").value.trim();
      if (!email || !token) { $("loginMsg").textContent = "Enter email and code."; return; }
      $("verifyCode").disabled = true;
      const { data, error } = await sbClient.auth.verifyOtp({ email, token, type: "email" });
      $("verifyCode").disabled = false;
      if (error) {
        $("loginMsg").innerHTML = '<span class="err">' + escapeHtml(error.message) + "</span>";
        return;
      }
      if (data && data.session) onSignedIn(data.session);
    };

    $("signOut").onclick = async () => {
      await sbClient.auth.signOut();
      window.location.reload();
    };

    $("refresh").onclick = loadQueue;
    $("modeOpen").onclick = () => setStatus("open");
    $("modeActioned").onclick = () => setStatus("actioned");
    $("modeDismissed").onclick = () => setStatus("dismissed");

    window.addEventListener("beforeunload", releaseObjectUrls);

    boot();
  </script>
</body>
</html>
